else{h=`<h2>AlRawaq – Daily Register · ${b} · ${d}</h2><table><tr><th>Item</th><th>Amount</th></tr>`+GRS().map(g=>{const x=g.i.filter(i=>pv(v[i[0]]));return x.length?`<tr><th colspan=2>${esc(g.n)}</th></tr>`+x.map(i=>`<tr><td>${esc(i[1])}</td><td>${f2(pv(v[i[0]]))}</td></tr>`).join(''):''}).join('')+`<tr><th colspan=2>REVENUE</th></tr>`+C.rev.filter(i=>pv(v[i[0]])).map(i=>`<tr><td>${esc(i[1])}</td><td>${f2(pv(v[i[0]]))}</td></tr>`).join('')+`<tr><th>Total expenses</th><th>${f2(t.e)}</th></tr><tr><th>Total revenue</th><th>${f2(t.r)}</th></tr><tr><th>Net</th><th>${f2(t.n)}</th></tr><tr><th>Running balance</th><th>${f2(cu)}</th></tr></table><p>Cashier: ${esc(r?r.by:me.u)} &nbsp; Status: ${r?ST[r.st]:''} &nbsp; Sign: __________</p>`}

const run={};bs.forEach(b=>{let s=0;run[b]=days.map(d=>{const r=D.recs[key(d,b)];if(r&&r.st!=='draft')s+=tot(r.v).n;return s})});
let H=`<tr><th rowspan=2>Item</th>${days.map(d=>`<th colspan=${bs.length}>${d.slice(8)}</th>`).join('')}<th colspan=${bs.length}>Adjs${me.role==='admin'?' ✎':''}</th><th colspan=${bs.length+1}>Monthly Total</th></tr><tr>${days.map(()=>bs.map(b=>`<th>${b}</th>`).join('')).join('')}${bs.map(b=>`<th>${b}</th>`).join('')}${bs.map(b=>`<th>${b}</th>`).join('')}<th>All</th></tr>`;
const line=(lbl,fn,cls,ids,mg,ex)=>{const cells=days.map((d,di)=>bs.map(b=>`<td>${f2(fn(d,b,di))||''}</td>`).join('')).join('');const adj=bs.map(b=>ids?(me.role==='admin'&&ids.length===1?`<td style="cursor:pointer" onclick="adjWin('${b}','${ids[0]}')">${f2(A(b,ids[0]))||'<span style="color:var(--mu)">✎</span>'}</td>`:`<td>${f2(ids.reduce((a,i)=>a+A(b,i),0))||''}</td>`):(ex?`<td>${f2(ex(b))||''}</td>`:'<td></td>')).join('');const ms=bs.map(b=>{const x=days.reduce((a,d,di)=>a+fn(d,b,di),0)+(ids?ids.reduce((a,i)=>a+A(b,i),0):0)+(ex?ex(b):0);return x});return`<tr class="${cls||''}"><td title="${esc(lbl)}">${esc(lbl)}</td>${cells}${adj}${ms.map(x=>`<td>${f2(x)||''}</td>`).join('')}${mg?`<td rowspan="2" style="font-weight:800;font-size:15px;background:var(--pr);color:var(--pt);vertical-align:middle;text-align:center">${f2(ms.reduce((a,b)=>a+b,0))}</td>`:`<td>${f2(ms.reduce((a,b)=>a+b,0))||''}</td>`}</tr>`};
let B2='';GRS().forEach(g=>{B2+=`<tr class="g"><td>${esc(g.n)}</td><td colspan="${(n+1)*bs.length+bs.length+1}"></td></tr>`;g.i.forEach(i=>B2+=line(i[1],(d,b)=>V(d,b,i[0]),'',[i[0]]))});
B2+=line('TOTAL EXPENSES',(d,b)=>EXP.reduce((a,i)=>a+V(d,b,i),0),'t',EXP);
B2+=`<tr class="g"><td>REVENUE</td><td colspan="${(n+1)*bs.length+bs.length+1}"></td></tr>`;C.rev.forEach(i=>B2+=line(i[1],(d,b)=>V(d,b,i[0]),'',[i[0]]));
B2+=line('TOTAL REVENUE',(d,b)=>RV.reduce((a,i)=>a+V(d,b,i),0),'t',RV);B2+=line('Cash + POS + Major Pymt',(d,b)=>V(d,b,'r95')+V(d,b,'r96')+V(d,b,'r97'),'t',['r95','r96','r97']);
B2+=line('NET (Revenue − Expenses)',(d,b)=>RV.reduce((a,i)=>a+V(d,b,i),0)-EXP.reduce((a,i)=>a+V(d,b,i),0),'t',null,1,b=>RV.reduce((a,i)=>a+A(b,i),0)-EXP.reduce((a,i)=>a+A(b,i),0));
B2+=`<tr class="t"><td>RUNNING BALANCE</td>${days.map((d,di)=>bs.map(b=>`<td>${f2(run[b][di])}</td>`).join('')).join('')}${bs.map(()=>'<td></td>').join('')}${bs.map(b=>`<td>${f2(run[b][n-1])}</td>`).join('')}</tr>`;
$('#v').innerHTML=`<div class="card row"><div><label>Month</label><input type="month" value="${m}" onchange="MS.m=this.value;sheetView()"></div><div><label>Branch</label><select onchange="MS.b=this.value;sheetView()">${['ALL',...BR].map(x=>`<option ${x===MS.b?'selected':''}>${x}</option>`).join('')}</select></div><div style="display:flex;gap:6px;align-items:flex-end"><button class="p" onclick="csv()">Download CSV</button>${me.role==='admin'?'<button onclick="adjWin()">＋ Adjustment</button>':''}<button onclick="bk()">Backup</button><button onclick="mprint()">Print</button></div></div><p style="font-size:12px;color:var(--mu)">Only submitted and approved days appear here. Staff advances are not part of this register.</p><div class="sc"><table><thead>${H}</thead><tbody>${B2}</tbody></table></div>${me.role==='admin'?'<div class="card row" style="margin-top:12px"><button onclick="addCat()">＋ Add category / item</button><button onclick="addEmp()">＋ Add employee</button></div>':''}`}

async function dl(name,text,type){const b=new Blob(['\ufeff'+text],{type});try{const d=await claude.use('downloads');if(d){await d.save({filename:name,data:b});return}}catch(e){if(e&&e.code==='declined')return}const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}
function csv(){const m=MS.m,n=dim(m),days=[...Array(n)].map((_,i)=>m+'-'+String(i+1).padStart(2,'0')),q=s=>'"'+String(s).replace(/"/g,'""')+'"';
const V=(d,b,i)=>{const r=D.recs[key(d,b)];return r&&r.st!=='draft'?pv(r.v[i]):''};let o=[[q('Category'),q('Item'),...days.flatMap(d=>BR.map(b=>q(d+' '+b))),...BR.map(b=>q('Adj '+b)),...BR.map(b=>q('Total '+b)),q('Grand Total')].join(',')];
const add=(g,i)=>{const cs=days.flatMap(d=>BR.map(b=>V(d,b,i)));const ad=BR.map(b=>(D.adj[m+'|'+b]||{})[i]??'');const mt=BR.map((b,k)=>days.reduce((a,d)=>a+(+V(d,b,i)||0),0)+pv(ad[k]));o.push([q(g),q(NAME[i]),...cs,...ad,...mt,mt.reduce((a,b)=>a+b,0)].join(','))};
GRS().forEach(g=>g.i.forEach(i=>add(g.n,i[0])));C.rev.forEach(i=>add('REVENUE',i[0]));dl('AlRawaq_'+m+'.csv',o.join('\r\n'),'text/csv')}

const sI=(rs,ids)=>rs.reduce((a,r)=>a+ids.reduce((s,i)=>s+pv(r.v[i]),0),0);
let T1='',T2='',T3='';BR.forEach(b=>{const rs=live(b),pos=sI(rs,['r96']),bk=D.bank[m+'|'+b],has=String(bk??'').trim()!=='',df=pv(bk)-pos;

const eA=rs.reduce((a,r)=>a+tot(r.v).e,0),eB=sI(rs,EXP),rA=rs.reduce((a,r)=>a+tot(r.v).r,0),rB=sI(rs,RV),nA=rs.reduce((a,r)=>a+tot(r.v).n,0);
T2+=`<tr><td>${b}</td><td>${f2(eA-eB)}</td><td>${f2(rA-rB)}</td><td>${f2(nA-(rB-eB))}</td><td>${tg(Math.abs(eA-eB)+Math.abs(rA-rB)+Math.abs(nA-(rB-eB)))}</td></tr>`;
let ms=[],dr=0,pe=0,ap=0,ng=0,lt=0;days.forEach(d=>{const r=D.recs[key(d,b)];if(!r)ms.push(d.slice(8));else if(r.st==='draft'){dr++;ms.push(d.slice(8)+'*')}else{r.st==='approved'?ap++:pe++;if(tot(r.v).n<0)ng++;if(r.ts>new Date(d+'T00:00').getTime()+2*864e5)lt++}});
